name: Postman Bootstrap

"on":
  push:
    branches: [main]
    paths:
      - 'docs/**'
  workflow_dispatch:

jobs:
  bootstrap:
    name: bootstrap st-bookstore-api-new
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Postman service token
        id: resolve-token
        uses: postman-cs/postman-resolve-service-token-action@v2
        with:
          postman-region: us
          postman-api-key: ${{ secrets.POSTMAN_API_KEY }}

      - name: Bootstrap Postman workspace
        uses: postman-cs/postman-bootstrap-action@v2
        with:
          spec-path: docs/swagger.json
          project-name: st-bookstore-api-new
          workspace-team-id: '177513'
          postman-region: us
          postman-api-key: ${{ secrets.POSTMAN_API_KEY }}
          postman-access-token: ${{ steps.resolve-token.outputs.token }}
