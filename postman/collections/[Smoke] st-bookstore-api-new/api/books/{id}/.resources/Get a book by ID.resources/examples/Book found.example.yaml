$kind: http-example
id: aae89431-8cbf-431a-b6ca-8cffcfe9e983
request:
  url: "{{baseUrl}}/api/books/:id"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: id
      value: string
      description: Resource identifier (Mongo ObjectId)
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "bookId": "string",
        "title": "string",
        "author": "string",
        "_id": "string",
        "description": "string",
        "publishedYear": 8883,
        "genre": "string",
        "coverImage": "https://bsrG.unwK.IX39O0X3MNR",
        "createdAt": "1981-03-20T19:03:04.592Z",
        "updatedAt": "2000-05-31T18:47:18.908Z"
      }
order: 1000
