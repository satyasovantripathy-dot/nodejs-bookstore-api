$kind: http-example
id: 8fb118fa-8220-4013-935d-09bfb0d5e025
request:
  url: "{{baseUrl}}/api/books/:id"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: id
      value: string
      description: Resource identifier (Mongo ObjectId)
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "status": "string",
        "message": "string"
      }
order: 2000
