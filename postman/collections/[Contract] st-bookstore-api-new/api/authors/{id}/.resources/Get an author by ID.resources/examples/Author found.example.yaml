$kind: http-example
id: e4d82973-892a-486c-a11c-dec3c2e46237
request:
  url: "{{baseUrl}}/api/authors/:id"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: id
      value: string
      description: Resource identifier (Mongo ObjectId)
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "name": "string",
        "_id": "string",
        "bio": "string",
        "birthDate": "1961-11-24",
        "books": [
          "string",
          "string"
        ],
        "createdAt": "2026-02-08T07:07:35.689Z",
        "updatedAt": "2007-09-16T08:06:20.375Z"
      }
order: 1000
