$kind: http-example
id: 864f5f6e-b252-4727-8a21-4d2a691b803f
request:
  url: "{{baseUrl}}/api/authors/:id"
  method: PUT
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: id
      value: string
      description: Resource identifier (Mongo ObjectId)
  body:
    type: json
    content: |-
      {
        "name": "string",
        "bio": "string",
        "birthDate": "1954-09-15"
      }
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "status": "string",
        "message": "string"
      }
order: 2000
