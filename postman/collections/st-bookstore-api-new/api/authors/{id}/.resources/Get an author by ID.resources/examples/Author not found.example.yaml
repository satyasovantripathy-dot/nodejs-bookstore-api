$kind: http-example
id: 465eaace-523c-4af1-896a-56cb44c40c79
request:
  url: "{{baseUrl}}/api/authors/:id"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: id
      value: string
      description: Resource identifier (Mongo ObjectId)
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "status": "string",
        "message": "string"
      }
order: 2000
